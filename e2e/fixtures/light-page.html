<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LunarShield fixture</title>
    <style>
      body {
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, sans-serif;
        padding: 2rem;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 1rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>LunarShield e2e fixture</h1>
    <p>This page has a light background and is used to verify the theme engine.</p>
    <div class="card">
      <img id="light-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt="1x1 white pixel" />
      <img id="dark-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" alt="1x1 black pixel" style="background:#000" />
      <label>Name <input id="name-input" type="text" /></label>
    </div>
    <div id="shadow-host"></div>
    <script>
      // Attach an open shadow root after load — exercises the MAIN-world patch.
      const host = document.getElementById('shadow-host')
      const root = host.attachShadow({ mode: 'open' })
      root.innerHTML = '<p>inside shadow</p>'
    </script>
  </body>
</html>
